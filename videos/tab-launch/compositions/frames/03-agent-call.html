  <script>
    (function () {
      var ID = "03-agent-call";
      var DURATION = 9.796;
      var PROMPT = "Split dinner, 6 USDC, with Meera and Aarav";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var q = function (id) { return root.querySelector('[id="' + id + '"]'); };

      var typed = q(ID + "-typed");
      var chars = [];
      for (var i = 0; i < PROMPT.length; i++) {
        var s = document.createElement("span");
        s.textContent = PROMPT[i];
        s.style.display = "none";
        typed.appendChild(s);
        chars.push(s);
      }
      var caret = document.createElement("span");
      caret.className = "03-agent-call-caret";
      typed.appendChild(caret);

      var win = q(ID + "-win");
      var cam = q(ID + "-cam");
      var phone = q(ID + "-phone");
      var ph = q(ID + "-ph");
      var bubble = q(ID + "-bubble");
      var chip = q(ID + "-chip");
      var spin = q(ID + "-spin");
      var tick = q(ID + "-tick");
      var head = q(ID + "-head");
      var row1 = q(ID + "-row1");
      var row2 = q(ID + "-row2");
      var ul = q(ID + "-ul");

      var tl = gsap.timeline({ paused: true });

      // Scene 1: window rises and settles flat out of a slight 3D tilt.
      tl.fromTo(win,
        { opacity: 0, y: 70, rotationY: -6, rotationX: 3, scale: 0.97 },
        { opacity: 1, y: 0, rotationY: 0, rotationX: 0, scale: 1, duration: 1.1, ease: "expo.out" }, 0);
      tl.fromTo(cam, { scale: 1, x: 0, y: 0 }, { scale: 1.02, x: -19, y: -10, duration: 7.6, ease: "none" }, 0);

      // Hidden-until-cued states, set deterministically at t=0.
      tl.set([bubble, chip, head, row1, row2], { opacity: 0 }, 0);
      tl.set(tick, { scale: 0, opacity: 0 }, 0);
      tl.set(phone, { opacity: 0, y: 140 }, 0);
      tl.set(ul, { scaleX: 0 }, 0);

      // Caret blink while idle (explicit sets, seek-safe).
      var blinkTimes = [0.5, 0.9, 1.3];
      blinkTimes.forEach(function (t, n) { tl.set(caret, { opacity: n % 2 === 0 ? 0 : 1 }, t); });
      tl.set(caret, { opacity: 1 }, 1.5);

      // Scene 2: per-character typing on "Split" (1.58s) through ~3.5s.
      var typeStart = 1.58, typeEnd = 3.5;
      var step = (typeEnd - typeStart) / (PROMPT.length - 1);
      tl.set(ph, { opacity: 0 }, typeStart);
      chars.forEach(function (c, n) { tl.set(c, { display: "inline" }, typeStart + n * step); });

      // Send: input clears, user bubble pops in at the right.
      var sendT = 3.68;
      tl.set(chars, { display: "none" }, sendT);
      tl.set(ph, { opacity: 1 }, sendT + 0.05);
      tl.fromTo(bubble,
        { opacity: 0, y: 380, scale: 0.9 },
        { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "expo.out" }, sendT);

      // Scene 3: tool chip with spinner resolving to a tick, then the header line.
      tl.fromTo(chip, { opacity: 0, scale: 0.9, x: -10 }, { opacity: 1, scale: 1, x: 0, duration: 0.5, ease: "back.out(1.4)" }, 4.05);
      tl.fromTo(spin, { rotation: 0 }, { rotation: 900, duration: 1.0, ease: "none" }, 4.05);
      tl.set(spin, { opacity: 0 }, 5.05);
      tl.fromTo(tick, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.4)" }, 5.05);
      tl.fromTo(head, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 5.25);

      // Scene 4: result rows cascade on "pay link" / "each"; real split page rises at right.
      tl.fromTo(row1, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 6.4);
      tl.fromTo(row2, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 6.92);
      tl.fromTo(phone, { opacity: 0, y: 140 }, { opacity: 1, y: 0, duration: 1.4, ease: "power3.out" }, 6.0);

      // Scene 5: push-in toward Meera's exact amount on "exact"; sunny underline on "amount".
      var s = 1.45, px = 760, py = 500;
      tl.to(cam, { scale: s, x: 960 - s * px, y: 470 - s * py, duration: 1.86, ease: "expo.out" }, 7.94);
      tl.to(phone, { x: 90, duration: 1.86, ease: "expo.out" }, 7.94);
      tl.to(row2, { opacity: 0.55, duration: 0.8, ease: "power2.out" }, 8.1);
      tl.fromTo(ul, { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 8.45);

      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
