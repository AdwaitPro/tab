  <div id="root" data-composition-id="04-pay-page" data-width="1920" data-height="1080" data-start="0" data-duration="9.068">
    <style>
      @font-face{font-family:satoshi;src:url("assets/fonts/captured-Satoshi_500-s.p.2gbh8zsgu5xby.woff2")format("woff2");font-weight:500;font-style:normal;font-display:block}
      @font-face{font-family:satoshi;src:url("assets/fonts/captured-Satoshi_700-s.p.19z5sx2nusz2v.woff2")format("woff2");font-weight:700;font-style:normal;font-display:block}
      @font-face{font-family:satoshi;src:url("assets/fonts/captured-Satoshi_900-s.p.03d7m3bcbsl0m.woff2")format("woff2");font-weight:900;font-style:normal;font-display:block}
      @font-face{font-family:"Instrument Serif";src:url("assets/fonts/captured-7ebf22b5a21034f8-s.p.3strvg7o-g5v2.woff2")format("woff2");font-weight:400;font-style:italic;font-display:block}

      .p04-shot{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block;

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var DURATION = 8.568;
        var q = function (id) { return document.getElementById("04-pay-page-" + id); };
        // Camera: scale s, image point (fx,fy) lands at screen point (sx,sy).
        function cam(s, fx, fy, sx, sy) { return { scale: s, x: sx - s * fx, y: sy - s * fy }; }

        var tl = gsap.timeline({ paused: true });
        var stage = q("stage");

        // Scene 1: wide page, push in toward the card.
        tl.fromTo(stage, cam(1.0, 960, 540, 960, 540),
          Object.assign(cam(1.22, 960, 430, 960, 450), { duration: 1.6, ease: "expo.out" }), 0);

        // Scene 2: "Two USDC" · tight on the amount, bracket draws.
        tl.to(stage, Object.assign(cam(2.2, 962, 268, 960, 450), { duration: 1.25, ease: "power3.inOut" }), 1.55);
        tl.fromTo(q("bracket").querySelectorAll("path"), { strokeDashoffset: 1 },
          { strokeDashoffset: 0, duration: 0.6, ease: "power2.out", stagger: 0.06 }, 1.96);
        tl.fromTo(q("ask"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 2.15);

        // Scene 3: "a tiny tag" · glide to the tag line, sunny sweep behind 0.003324.
        tl.to(stage, Object.assign(cam(2.4, 962, 342, 960, 450), { duration: 1.1, ease: "power3.inOut" }), 3.1);
        tl.to(q("bracket"), { opacity: 0, duration: 0.35, ease: "power1.out" }, 3.1);
        tl.to(q("ask"), { opacity: 0, x: 16, duration: 0.35, ease: "power1.out" }, 3.1);
        tl.fromTo(q("hl"), { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.out" }, 3.67);

        // Scene 4: pull back to the full card, shifted left; phones rise with parallax.
        tl.to(stage, Object.assign(cam(0.9, 960, 463, 620, 440), { duration: 1.35, ease: "power3.inOut" }), 5.9);
        tl.fromTo(q("phone-light"), { y: 760 }, { y: 0, duration: 1.2, ease: "expo.out" }, 6.14);
        tl.fromTo(q("phone-dark"), { y: 860 }, { y: 0, duration: 1.3, ease: "expo.out" }, 6.3);
        tl.fromTo(q("h"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 6.49);
        tl.fromTo(q("wallet"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 6.74);
        tl.fromTo(q("sub"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 7.38);

        // Hold: slow drift between depth layers.
        tl.to(stage, Object.assign(cam(0.92, 960, 463, 620, 440), { duration: DURATION - 7.25, ease: "none" }), 7.25);
        tl.to(q("phone-light"), { y: -8, duration: DURATION - 7.4, ease: "none" }, 7.4);
        tl.to(q("phone-dark"), { y: -18, duration: DURATION - 7.6, ease: "none" }, 7.6);

        tl.set({}, {}, DURATION);
        window.__timelines = window.__timelines || {};
        window.__timelines["04-pay-page"] = tl;
      })();
    </script>
