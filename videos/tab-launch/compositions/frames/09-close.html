    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script>
      (function () {
        var FRAME_ID = "09-close";
        var DURATION = 6.6;
        var q = function (id) { return document.getElementById(FRAME_ID + "-" + id); };

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        window.__timelines[FRAME_ID] = tl;

        var clamp01 = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
        var easeOutCubic = function (v) { return 1 - Math.pow(1 - v, 3); };
        var easeOutQuart = function (v) { return 1 - Math.pow(1 - v, 4); };
        var easeOutExpo = function (v) { return v >= 1 ? 1 : 1 - Math.pow(2, -10 * v); };

        var renderAt = function () {};

        var W = 1920;
        var H = 1080;

        function drawCoinFace() {
          const size = 1024;
          const c = document.createElement("canvas");
          c.width = size;
          c.height = size;
          const g = c.getContext("2d");
          const r = size / 2;

          const disc = g.createRadialGradient(r * 0.72, r * 0.62, r * 0.05, r, r, r);
          disc.addColorStop(0, "#FFF3D2");
          disc.addColorStop(0.45, "#F1D38C");
          disc.addColorStop(0.85, "#D9AE57");
          disc.addColorStop(1, "#B98A35");
          g.fillStyle = disc;
          g.fillRect(0, 0, size, size);

          g.lineWidth = 14;
          g.strokeStyle = "rgba(150, 105, 35, 0.55)";
          g.beginPath();
          g.arc(r, r, r * 0.84, 0, Math.PI * 2);
          g.stroke();
          g.lineWidth = 6;
          g.strokeStyle = "rgba(255, 248, 228, 0.85)";
          g.beginPath();
          g.arc(r - 3, r - 4, r * 0.865, 0, Math.PI * 2);
          g.stroke();

          g.textAlign = "center";
          g.textBaseline = "middle";
          g.font = "900 600px sans-serif";
          const cy = r + 20;
          g.fillStyle = "rgba(120, 80, 20, 0.55)";
          g.fillText("$", r + 12, cy + 14);
          g.fillStyle = "rgba(255, 250, 235, 0.95)";
          g.fillText("$", r - 6, cy - 7);
          const glyph = g.createLinearGradient(0, r * 0.3, 0, r * 1.7);
          glyph.addColorStop(0, "#EBC874");
          glyph.addColorStop(1, "#C08A33");
          g.fillStyle = glyph;
          g.fillText("$", r, cy);

          const tex = new THREE.CanvasTexture(c);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.anisotropy = 8;
          return tex;
        }

        function buildCoinScene(canvas) {
          const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
          renderer.setPixelRatio(1);
          renderer.setSize(W, H, false);
          renderer.outputColorSpace = THREE.SRGBColorSpace;
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure = 1.1;
          renderer.setClearColor(0x000000, 0);

          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
          camera.position.set(0, 0, 10);

          scene.add(new THREE.HemisphereLight(0xffffff, 0xdbe9ff, 1.2));
          const key = new THREE.DirectionalLight(0xffffff, 2.2);
          key.position.set(-4, 5, 6);
          scene.add(key);
          const rim = new THREE.DirectionalLight(0x1a88f8, 1.5);
          rim.position.set(4, 2, -5);
          scene.add(rim);

          const coinGeo = new THREE.CylinderGeometry(1, 1, 0.16, 96);
          // Face the +y cap to camera, then roll 90deg so the "$" reads upright and unmirrored.
          coinGeo.rotateX(Math.PI / 2);
          coinGeo.rotateZ(Math.PI / 2);
          const faceTex = drawCoinFace();
          const edgeMat = new THREE.MeshStandardMaterial({ color: 0xe8c877, metalness: 0.9, roughness: 0.28 });
          const faceMat = new THREE.MeshStandardMaterial({ map: faceTex, metalness: 0.35, roughness: 0.32 });
          const coinMesh = new THREE.Mesh(coinGeo, [edgeMat, faceMat, faceMat]);
          const coin = new THREE.Group();
          coin.add(coinMesh);
          scene.add(coin);

          const nodeGeo = new THREE.SphereGeometry(0.55, 64, 48);
          const makeNode = () => {
            const mat = new THREE.MeshPhysicalMaterial({
              color: 0x1a88f8,
              clearcoat: 1,
              clearcoatRoughness: 0.08,
              roughness: 0.15,
              metalness: 0.1,
              emissive: 0x1a88f8,
              emissiveIntensity: 0.12,
              transparent: true,
            });
            const mesh = new THREE.Mesh(nodeGeo, mat);
            scene.add(mesh);
            return mesh;
          };
          const nodeA = makeNode();
          const nodeM = makeNode();

          return { renderer, scene, camera, coin, nodeA, nodeM };
        }

        if (typeof THREE !== "undefined") {
          var three = buildCoinScene(q("three"));
          var renderer = three.renderer, scene = three.scene, camera = three.camera, coin = three.coin;
          var nodeL = three.nodeA, nodeR = three.nodeM;
          coin.scale.setScalar(0.62);
          nodeL.position.set(-2.2, 1.35, 0);
          nodeR.position.set(2.2, 1.35, 0);

          var COIN_END = new THREE.Vector3(0, 1.45, 0);
          var COIN_START = new THREE.Vector3(-6.4, 4.4, 1.2);
          var LAND = 1.3;

          renderAt = function (t) {
            var n = easeOutCubic(clamp01(t / 0.7));
            var ns = 0.6 * n;
            nodeL.scale.setScalar(Math.max(ns, 0.0001));
            nodeR.scale.setScalar(Math.max(ns, 0.0001));

            var p = clamp01(t / LAND);
            var e = easeOutExpo(p);
            var arc = Math.sin(Math.PI * e) * 0.9;
            coin.position.set(
              COIN_START.x + (COIN_END.x - COIN_START.x) * e,
              COIN_START.y + (COIN_END.y - COIN_START.y) * e + arc,
              COIN_START.z + (COIN_END.z - COIN_START.z) * e
            );
            var s = 1 - easeOutQuart(p);
            coin.rotation.y = -s * Math.PI * 6;
            coin.rotation.x = s * 0.55;
            coin.rotation.z = s * 0.35;
            renderer.render(scene, camera);
          };
        }

        var st = { t: 0 };
        tl.to(st, { t: DURATION, duration: DURATION, ease: "none", onUpdate: function () { renderAt(st.t); } }, 0);

        // Scene 1: nodes present, coin lands, on "Tab" the lockup arrives under it.
        tl.fromTo([q("av-a"), q("av-m")], { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.08 }, 0.15);
        tl.fromTo(q("mark"), { y: 26, scale: 0.86, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.8, ease: "expo.out" }, 0.2);
        tl.fromTo(q("word"), { x: -18, opacity: 0, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.8, ease: "expo.out" }, 0.3);
        tl.fromTo(q("link-l"), { clipPath: "inset(0px 1320px 0px 600px)" }, { clipPath: "inset(0px 1102px 0px 600px)", duration: 0.7, ease: "power3.out" }, 0.75);
        tl.fromTo(q("link-r"), { clipPath: "inset(0px 600px 0px 1320px)" }, { clipPath: "inset(0px 600px 0px 818px)", duration: 0.7, ease: "power3.out" }, 0.75);
        tl.fromTo(q("shadow"), { opacity: 0, scaleX: 0.5 }, { opacity: 1, scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.95);
        tl.fromTo(q("pulse"), { scale: 0.85, opacity: 0.7 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: "expo.out" }, 1.22);

        // Scene 2: the line builds word by word on the voice.
        var words = [["w1", 1.12], ["w2", 1.76], ["w3", 1.97], ["w4", 2.1]];
        words.forEach(function (w) {
          tl.fromTo(q(w[0]), { y: 34, opacity: 0, filter: "blur(10px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, w[1]);
        });

        // Scene 3: credit pill, then the URLs; everything lands still by ~3.9s and holds.
        tl.fromTo(q("built"), { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.4)" }, 2.9);
        tl.fromTo(q("url-1"), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 3.05);
        tl.fromTo(q("url-2"), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 3.17);

        tl.set({}, {}, DURATION);

        window.addEventListener("hf-seek", function () { renderAt(window.__timelines[FRAME_ID].time()); });
        renderAt(0);
      })();
    </script>
