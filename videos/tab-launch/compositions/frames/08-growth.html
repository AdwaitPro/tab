    <style>

    <h1 class="clip 08-growth-headline" data-start="0" data-duration="3.844" data-track-index="2">
      <span class="08-growth-line"><span class="08-growth-word 08-growth-w">Every</span><span class="08-growth-word 08-growth-w">link</span><span class="08-growth-word 08-growth-w">brings</span></span>
      <span class="08-growth-line"><span class="08-growth-word 08-growth-serif 08-growth-sw">someone</span><span class="08-growth-word 08-growth-serif 08-growth-sw">new</span></span>
    </h1>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var DURATION = 3.344;
        var SVGNS = "http://www.w3.org/2000/svg";
        var root = document.querySelector('[data-composition-id="08-growth"]');
        var svg = root.querySelector('[id="08-growth-svg"]');
        var nodesLayer = root.querySelector('[id="08-growth-nodes"]');

        var HUB = { x: 1240, y: 500, r: 78 };
        var FRIEND_R = 54;
        var RING = 330;
        var friends = [
          { letter: "M", angle: -58, ink: false, line: 0.47, flip: 1.62 },
          { letter: "A", angle: 180, ink: true, line: 0.6, flip: 1.78 },
          { letter: "?", angle: 58, ink: false, line: 0.73, flip: 1.94 }
        ];
        var OUTER_LEN = 190;
        var OUTER_SPREAD = 34;

        function rad(d) { return (d * Math.PI) / 180; }
        function polar(cx, cy, r, deg) { return { x: cx + r * Math.cos(rad(deg)), y: cy + r * Math.sin(rad(deg)) }; }

        function makeLine(a, b, inset0, inset1, stroke, width) {
          var dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
          var ux = dx / len, uy = dy / len;
          var x1 = a.x + ux * inset0, y1 = a.y + uy * inset0;
          var x2 = b.x - ux * inset1, y2 = b.y - uy * inset1;
          var drawn = Math.hypot(x2 - x1, y2 - y1);
          var el = document.createElementNS(SVGNS, "line");
          el.setAttribute("x1", x1); el.setAttribute("y1", y1);
          el.setAttribute("x2", x2); el.setAttribute("y2", y2);
          el.setAttribute("stroke", stroke);
          el.setAttribute("stroke-width", width);
          el.setAttribute("stroke-linecap", "round");
          el.setAttribute("stroke-dasharray", drawn);
          el.setAttribute("stroke-dashoffset", drawn);
          svg.appendChild(el);
          return { el: el, len: drawn };
        }

        function makeNode(cx, cy, r, extraClass) {
          var n = document.createElement("div");
          n.className = "08-growth-node " + (extraClass || "");
          n.style.left = cx - r + "px";
          n.style.top = cy - r + "px";
          n.style.width = r * 2 + "px";
          n.style.height = r * 2 + "px";
          nodesLayer.appendChild(n);
          return n;
        }

        var tl = gsap.timeline({ paused: true });

        var hub = makeNode(HUB.x, HUB.y, HUB.r, "08-growth-hub");
        hub.innerHTML = '<div class="08-growth-halo"></div><div class="08-growth-disc">A</div>';
        tl.fromTo(hub, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.4)" }, 0.08);
        tl.fromTo(hub.getElementsByClassName("08-growth-halo")[0], { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.9, ease: "expo.out" }, 0.2);

        friends.forEach(function (f) {
          var p = polar(HUB.x, HUB.y, RING, f.angle);
          var link = makeLine(HUB, p, HUB.r + 10, FRIEND_R + 8, "#1A88F8", 3);
          tl.to(link.el, { attr: { "stroke-dashoffset": 0 }, duration: 0.42, ease: "power3.out" }, f.line);

          var node = makeNode(p.x, p.y, FRIEND_R, "");
          node.innerHTML =
            '<div class="08-growth-disc 08-growth-outline">' + f.letter + '</div>' +
            '<div class="08-growth-disc 08-growth-filled' + (f.ink ? " 08-growth-ink" : "") + '">' + f.letter + '</div>' +
            '<div class="08-growth-label"' + (f.ink ? ' style="color:#222222"' : "") + '>in PayBox</div>';
          var outline = node.getElementsByClassName("08-growth-outline")[0];
          var filled = node.getElementsByClassName("08-growth-filled")[0];
          var label = node.getElementsByClassName("08-growth-label")[0];

          tl.fromTo(node, { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.4)" }, f.line + 0.3);

          tl.fromTo(outline, { scaleX: 1 }, { scaleX: 0, duration: 0.14, ease: "power2.in", immediateRender: false }, f.flip);
          tl.fromTo(filled, { scaleX: 0 }, { scaleX: 1, duration: 0.26, ease: "back.out(1.4)" }, f.flip + 0.14);
          tl.fromTo(label, { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, f.flip + 0.22);

          [-OUTER_SPREAD, OUTER_SPREAD].forEach(function (off, i) {
            var q = polar(p.x, p.y, OUTER_LEN, f.angle + off);
            var outer = makeLine(p, q, FRIEND_R + 8, 15, "rgba(26,136,248,.32)", 2);
            var t = f.flip + 0.32 + i * 0.08;
            tl.to(outer.el, { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power3.out" }, t);
            var dot = document.createElement("div");
            dot.className = "08-growth-dot";
            dot.style.left = q.x + "px";
            dot.style.top = q.y + "px";
            nodesLayer.appendChild(dot);
            tl.fromTo(dot, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.36, ease: "back.out(1.4)" }, t + 0.32);
          });
        });

        var camera = root.querySelector('[id="08-growth-camera"]');
        tl.fromTo(camera, { scale: 1.06 }, { scale: 0.97, duration: DURATION, ease: "power2.inOut" }, 0);

        var words = root.getElementsByClassName("08-growth-w");
        [0.12, 0.47, 0.85].forEach(function (t, i) {
          tl.fromTo(words[i], { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "expo.out", }, t);
        });
        var sw = root.getElementsByClassName("08-growth-sw");
        [1.58, 1.96].forEach(function (t, i) {
          tl.fromTo(sw[i], { y: 46, opacity: 0, filter: "blur(8px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, t);
        });

        tl.set({}, {}, DURATION);
        window.__timelines = window.__timelines || {};
        window.__timelines["08-growth"] = tl;
      })();
    </script>
  </div>
