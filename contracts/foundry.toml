[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false


[lint]
# Deadlines are hours-to-days long; validator timestamp drift (seconds) is irrelevant to them.
# Reverts inside the constructor loop are intentional input validation; partial tuple reads of
# latestRoundData are intentional. Tests compile without via-ir, so block.timestamp is not cached across vm.warp.
exclude_lints = ["block-timestamp", "require-revert-in-loop", "unused-return", "environment-read-across-mutation"]
